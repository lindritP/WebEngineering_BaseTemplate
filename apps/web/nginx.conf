server {
  listen 80;
  root /usr/share/nginx/html;

  # Same job as the Vite proxy in dev: forward /api to the api container
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA fallback: /bears/u-arctos has no file, React Router handles it
  location / {
    try_files $uri $uri/ /index.html;
  }
}